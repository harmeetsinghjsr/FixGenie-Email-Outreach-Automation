# ===========================================================================
# FixGenie - fully automated daily pipeline (GitHub Actions, free tier).
#
# Once a day it: finds leads -> personalizes (LLM) -> enrich -> validate ->
# push (to your Google Sheet) -> outreach (sends first emails + follow-ups).
# Follow-up emails are AI-written too (steps 2 & 3 use per-lead openers).
#
# ---- SETUP: add these repo secrets (Settings -> Secrets and variables ->
#      Actions -> New repository secret) ----
#   GOOGLE_SERVICE_ACCOUNT_JSON   (paste the FULL contents of service_account.json)
#   GOOGLE_SHEET_NAME             (e.g. FixGenie Leads Master)
#   EMAIL_PROVIDER               (brevo)
#   BREVO_API_KEY                (xkeysib-...)   # or the GMAIL_* pair for gmail
#   SENDER_NAME, SENDER_COMPANY, SENDER_EMAIL, SENDER_POSTAL_ADDRESS
#   UNSUBSCRIBE_BASE_URL
#   LLM_BASE_URL, LLM_API_KEY, LLM_MODEL         (for personalization + AI follow-ups)
#   HUNTER_API_KEY               (optional; leave unset to keep it off)
#
# Notes:
#  - Times are UTC. Change the cron below to your preferred send time.
#  - Discovery/personalize are best-effort (continue-on-error) so a flaky Exa or
#    LLM call never blocks the outreach send.
#  - DAILY_SEND_LIMIT is set to 30 below (matches your warm-up rate).
# ===========================================================================
name: FixGenie Daily Pipeline

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 13:00 UTC, weekdays. Adjust to your time zone.
  workflow_dispatch:          # manual "Run workflow" button in the Actions tab
    inputs:
      skip_discovery:
        description: "Only send outreach (skip finding new leads)?"
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Install lead-finder tools (mcporter + Exa)
        run: |
          npm install -g mcporter
          mcporter config add exa https://mcp.exa.ai/mcp --scope home

      - name: Write Google service-account file
        run: |
          mkdir -p config
          cat > config/service_account.json <<'JSON'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JSON

      - name: Build .env from secrets
        run: |
          cat > .env <<EOF
          GOOGLE_SERVICE_ACCOUNT_JSON=./config/service_account.json
          GOOGLE_SHEET_NAME=${{ secrets.GOOGLE_SHEET_NAME }}
          HUNTER_API_KEY=${{ secrets.HUNTER_API_KEY }}
          EMAIL_PROVIDER=${{ secrets.EMAIL_PROVIDER }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME=${{ secrets.SENDER_NAME }}
          SENDER_COMPANY=${{ secrets.SENDER_COMPANY }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          SENDER_POSTAL_ADDRESS=${{ secrets.SENDER_POSTAL_ADDRESS }}
          UNSUBSCRIBE_BASE_URL=${{ secrets.UNSUBSCRIBE_BASE_URL }}
          LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_MODEL=${{ secrets.LLM_MODEL }}
          LLM_USER_AGENT=claude-cli/1.0.60 (external)
          DAILY_SEND_LIMIT=30
          SEND_DELAY_SECONDS=45
          EOF

      - name: Find new leads (best-effort)
        if: ${{ github.event.inputs.skip_discovery != 'true' }}
        continue-on-error: true
        run: python scripts/bulk_find.py --num 5

      - name: Personalize + AI follow-ups (best-effort)
        if: ${{ github.event.inputs.skip_discovery != 'true' }}
        continue-on-error: true
        run: python scripts/personalize.py --delay 0.3

      - name: Enrich, validate, push to Sheet
        if: ${{ github.event.inputs.skip_discovery != 'true' }}
        continue-on-error: true
        run: |
          python -m fixgenie.cli enrich
          python -m fixgenie.cli validate
          python -m fixgenie.cli push

      - name: Send outreach + follow-ups
        run: python -m fixgenie.cli outreach
