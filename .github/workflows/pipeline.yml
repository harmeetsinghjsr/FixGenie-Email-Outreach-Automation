# ===========================================================================
# FixGenie - automated daily OUTREACH (GitHub Actions, free tier).
#
# Runs once a day and SENDS: first emails to new Valid leads + follow-ups
# (steps 2 & 3), then logs everything to the "Outreach Log" tab. It reads
# whatever leads are already in your Google Sheet.
#
# WHY sending-only in the cloud:
#   Finding leads (Exa) and AI personalization (your LLM gateway) are blocked
#   from GitHub's datacenter IPs, so those steps are done LOCALLY on your PC:
#     python scripts/bulk_find.py   ->  python scripts/personalize.py
#     python -m fixgenie.cli enrich && validate && push
#   (or use scripts/run_refill.bat). Then the cloud just keeps sending daily.
#
# ---- SETUP: add these repo secrets (Settings -> Secrets and variables ->
#      Actions) ----
#   GOOGLE_SERVICE_ACCOUNT_JSON   (full contents of service_account.json)
#   GOOGLE_SHEET_NAME
#   EMAIL_PROVIDER               (brevo)
#   BREVO_API_KEY
#   SENDER_NAME, SENDER_COMPANY, SENDER_EMAIL, SENDER_POSTAL_ADDRESS
#   UNSUBSCRIBE_BASE_URL
# ===========================================================================
name: FixGenie Daily Outreach

on:
  # Automatic daily sending is OFF. Everything runs on your PC now via
  # scripts\run_all.bat (find -> AI personalize -> send), so every email is
  # AI-written. To re-enable cloud auto-send, uncomment the schedule below.
  # schedule:
  #   - cron: "0 13 * * 1-5"   # 13:00 UTC, weekdays.
  workflow_dispatch:          # manual "Run workflow" button only

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Write Google service-account file
        run: |
          mkdir -p config
          cat > config/service_account.json <<'JSON'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JSON

      - name: Build .env from secrets
        run: |
          cat > .env <<EOF
          GOOGLE_SERVICE_ACCOUNT_JSON=./config/service_account.json
          GOOGLE_SHEET_NAME=${{ secrets.GOOGLE_SHEET_NAME }}
          EMAIL_PROVIDER=${{ secrets.EMAIL_PROVIDER }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          GMAIL_ADDRESS=${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME=${{ secrets.SENDER_NAME }}
          SENDER_COMPANY=${{ secrets.SENDER_COMPANY }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          SENDER_POSTAL_ADDRESS=${{ secrets.SENDER_POSTAL_ADDRESS }}
          UNSUBSCRIBE_BASE_URL=${{ secrets.UNSUBSCRIBE_BASE_URL }}
          DAILY_SEND_LIMIT=30
          SEND_DELAY_SECONDS=45
          EOF

      - name: Send outreach + follow-ups
        run: python -m fixgenie.cli outreach
