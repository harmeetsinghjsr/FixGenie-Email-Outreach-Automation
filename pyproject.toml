[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixgenie-outreach"
version = "1.0.0"
description = "Free, self-hosted lead-generation & cold-outreach pipeline for FixGenie Consulting Inc."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fixgenie = "fixgenie.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
